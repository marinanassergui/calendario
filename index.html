<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DayTrack - Meu Contador de Dias</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Main Stylesheet -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header class="app-header">
            <div class="header-top">
                <div class="logo-area">
                    <div class="logo-icon">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M8 2V5M16 2V5M3.5 9.002H20.5M21 8.5V17C21 20 19.5 22 16 22H8C4.5 22 3 20 3 17V8.5C3 5.5 4.5 3.5 8 3.5H16C19.5 3.5 21 5.5 21 8.5Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            <path d="M11.995 13.002H12.004M11.995 16.502H12.004M8.295 13.002H8.304M8.295 16.502H8.304M15.695 13.002H15.704M15.695 16.502H15.704" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </div>
                    <span class="logo-text">DayTrack</span>
                </div>
                <div class="header-actions">
                    <button id="share-btn" class="icon-btn" aria-label="Compartilhar">
                        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M4 12v7a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-7M12 2v13M12 2l-4 4M12 2l4 4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </button>
                    <button id="settings-btn" class="icon-btn" aria-label="Configurações">
                        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M12 15C13.6569 15 15 13.6569 15 12C15 10.3431 13.6569 9 12 9C10.3431 9 9 10.3431 9 12C9 13.6569 10.3431 15 12 15Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </button>
                </div>
            </div>

            <!-- Counter Visual -->
            <div class="counter-card">
                <div class="counter-ring-container">
                    <svg class="progress-ring" width="140" height="140">
                        <circle class="progress-ring__circle-bg" stroke="rgba(255, 255, 255, 0.08)" stroke-width="8" fill="transparent" r="60" cx="70" cy="70"/>
                        <circle class="progress-ring__circle" stroke="url(#gradient-accent)" stroke-width="10" stroke-linecap="round" fill="transparent" r="60" cx="70" cy="70"/>
                        <defs>
                            <linearGradient id="gradient-accent" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" stop-color="#a855f7" />
                                <stop offset="100%" stop-color="#10b981" />
                            </linearGradient>
                        </defs>
                    </svg>
                    <div class="counter-text">
                        <span id="total-days-count" class="counter-number">0</span>
                        <span class="counter-label">Restantes</span>
                    </div>
                </div>
                <div class="counter-details">
                    <h2 id="counter-title">Minha Jornada</h2>
                    <p id="counter-subtitle" class="counter-subtitle">Iniciado em --/--/----</p>
                </div>
            </div>
        </header>

        <!-- Main Body -->
        <main class="app-main">

            <!-- Actions and Filters -->
            <section class="controls-section">
                <div class="search-bar">
                    <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M21 21L15 15M17 10C17 13.866 13.866 17 10 17C6.13401 17 3 13.866 3 10C3 6.13401 6.13401 3 10 3C13.866 3 17 6.13401 17 10Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                    <input type="text" id="search-notes-input" placeholder="Buscar nas notas...">
                </div>

                <div class="filter-pills">
                    <button class="filter-pill active" data-filter="all">Todos</button>
                    <button class="filter-pill" data-filter="completed">Concluídos</button>
                    <button class="filter-pill" data-filter="notes">Com Notas</button>
                </div>
            </section>

            <!-- Days List/Grid -->
            <section class="days-section">
                <div class="days-header">
                    <h3>Registro Diário</h3>
                </div>

                <!-- Main Days Grid -->
                <div id="days-grid" class="days-grid">
                    <!-- Days will be loaded here dynamically by JavaScript -->
                    <div class="empty-state" id="empty-state">
                        <div class="empty-state-icon">
                            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <path d="M8 2V5M16 2V5M3 10H21M5 4H19C20.1046 4 21 4.89543 21 6V20C21 21.1046 20.1046 22 19 22H5C3.89543 22 3 21.1046 3 20V6C3 4.89543 3.89543 4 5 4Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            </svg>
                        </div>
                        <p class="empty-state-title">Nenhum dia registrado ainda</p>
                        <p class="empty-state-desc">Toque em "Novo Dia" para iniciar sua jornada e adicionar suas notas.</p>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <!-- Drawer Modal for Editing Day -->
    <div id="edit-day-modal" class="modal-overlay" aria-hidden="true">
        <div class="modal-container drawer">
            <div class="modal-header">
                <h3 id="modal-day-title">Editar Dia</h3>
                <button id="modal-close-btn" class="icon-btn" aria-label="Fechar">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M18 6L6 18M6 6L18 18" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </button>
            </div>
            <div class="modal-body">
                <form id="edit-day-form">
                    <input type="hidden" id="edit-day-id">
                    
                    <!-- Date Input -->
                    <div class="form-group">
                        <label for="edit-day-date">Data Associada</label>
                        <input type="date" id="edit-day-date" readonly disabled>
                    </div>

                    <!-- Status Toggle -->
                    <div class="form-group row-group">
                        <div class="label-desc">
                            <label for="edit-day-completed">Dia Concluído</label>
                            <span class="field-desc">Marque se você completou o objetivo do dia</span>
                        </div>
                        <label class="switch">
                            <input type="checkbox" id="edit-day-completed">
                            <span class="slider round"></span>
                        </label>
                    </div>

                    <!-- Note Textarea -->
                    <div class="form-group">
                        <label for="edit-day-note">Notas do Dia</label>
                        <textarea id="edit-day-note" rows="5" placeholder="O que aconteceu hoje? Quais foram seus aprendizados ou conquistas..."></textarea>
                    </div>

                    <div class="form-actions">
                        <button type="button" id="delete-day-btn" class="btn btn-outline-danger">Limpar</button>
                        <button type="submit" class="btn btn-primary">Salvar Dia</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Settings Dialog -->
    <div id="settings-modal" class="modal-overlay popup-mode" aria-hidden="true">
        <div class="modal-container popup">
            <div class="modal-header">
                <h3>Configurações do Rastreador</h3>
                <button id="settings-close-btn" class="icon-btn" aria-label="Fechar">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M18 6L6 18M6 6L18 18" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </button>
            </div>
            <div class="modal-body">
                <form id="settings-form">
                    <div class="form-group">
                        <label for="settings-title">Título do Evento</label>
                        <input type="text" id="settings-title" placeholder="Ex: Minha Viagem, Casamento, Prova..." required>
                    </div>
                    
                    <div class="form-group">
                        <label for="settings-start-date">Data de Início</label>
                        <input type="date" id="settings-start-date" required>
                    </div>

                    <div class="form-group">
                        <label for="settings-end-date">Data de Término (Evento)</label>
                        <input type="date" id="settings-end-date" required>
                    </div>

                    <div class="settings-actions">
                        <button type="submit" class="btn btn-primary btn-block">Salvar Alterações</button>
                        <hr class="divider">
                        <button type="button" id="reset-all-btn" class="btn btn-outline-danger btn-block">Reiniciar Todo o Contador</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Main JavaScript -->
    <script src="app.js"></script>
</body>
</html>
